<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atomic Habits Teaser - ChapterZero</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #0a1633;
        font-family: "Nunito", sans-serif;
      }

      #main-composition {
        width: 1920px;
        height: 1080px;
        position: relative;
      }

      #bg-comp,
      #intro-comp,
      #stats-comp,
      #captions-comp {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      #bg-comp {
        z-index: 1;
      }

      #intro-comp {
        z-index: 100;
      }

      #stats-comp {
        z-index: 150;
      }

      #captions-comp {
        z-index: 200;
      }

      #background-layer {
        position: absolute;
        inset: 0;
        background-color: #0a1633;
      }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div data-hf-id="hf-x6i9" id="main-composition" data-composition-id="main-video" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <!-- Framework-owned narration audio -->
      <audio id="narration-audio" class="clip" data-start="0" data-duration="15" data-track-index="0" src="assets/atomic-habits-teaser.mp3"></audio>

      <!-- Background Layer Composition (dark navy base) -->
      <div data-hf-id="hf-z9c4" id="bg-comp" data-composition-id="background" data-start="0" data-duration="15" data-width="1920" data-height="1080" data-track-index="1">
        <div data-hf-id="hf-0hdx" id="background-layer"></div>
        <style>
          #background-layer {
            position: absolute;
            inset: 0;
            background-color: #0a1633;
          }
        </style>
        <script>
          (function () {
            const tl = gsap.timeline({ paused: true });
            const bg = document.getElementById("background-layer");
            // Subtle deepen into the accumulation beat, ease back for the CTA. Navy throughout.
            tl.to(bg, { backgroundColor: "#0b1d4d", duration: 1.2, ease: "power2.inOut" }, 2.5);
            tl.to(bg, { backgroundColor: "#0a1633", duration: 1.2, ease: "power2.inOut" }, 11.5);
            window.__timelines = window.__timelines || {};
            window.__timelines["background"] = tl;
          })();
        </script>
      </div>

      <!-- Sub-compositions -->
      <div data-hf-id="hf-icdj" id="intro-comp" data-composition-id="intro" data-composition-src="compositions/intro.html" data-start="0" data-duration="15" data-width="1920" data-height="1080" data-track-index="100"></div>
      <div data-hf-id="hf-5n3d" id="stats-comp" data-composition-id="stats" data-composition-src="compositions/stats.html" data-start="0" data-duration="15" data-width="1920" data-height="1080" data-track-index="150"></div>
      <div data-hf-id="hf-pwud" id="captions-comp" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="15" data-width="1920" data-height="1080" data-track-index="200"></div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        window.__timelines["main-video"] = tl;
      </script>
    </div>
  </body>
</html>

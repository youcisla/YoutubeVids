<template id="intro-template">
  <div
    id="intro-root"
    data-composition-id="intro"
    data-start="0"
    data-duration="15"
    data-width="1920"
    data-height="1080"
  >
    <!-- Hook (0-2.5s) -->
    <div class="scene hook">
      <div class="hook-line" id="hook-what">WHAT IF</div>
      <div class="hook-percent" id="hook-percent">1%</div>
      <div class="hook-line" id="hook-enough">WAS ENOUGH?</div>
    </div>

    <!-- CTA end card (from 11.5s, held to 15s) -->
    <div class="scene cta" id="cta">
      <div class="cta-headline">SMALL HABITS. <span class="gold">BIG RESULTS.</span></div>
      <div class="cta-sub">WATCH THE FULL ATOMIC HABITS SUMMARY</div>
      <div class="cta-brand">EDU CHANNEL</div>
    </div>

    <style>
      [data-composition-id="intro"] .scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        pointer-events: none;
        font-family: "Nunito", sans-serif;
      }

      /* --- Hook --- */
      [data-composition-id="intro"] .hook-line {
        font-weight: 800;
        font-size: 120px;
        letter-spacing: 6px;
        color: #f5f3ec;
        line-height: 1;
        margin: 8px 0;
        visibility: hidden;
      }

      [data-composition-id="intro"] .hook-percent {
        font-weight: 900;
        font-size: 420px;
        line-height: 0.9;
        color: #ffc83d; /* dominant gold */
        margin: 4px 0;
        visibility: hidden;
      }

      /* --- CTA --- */
      [data-composition-id="intro"] .cta {
        visibility: hidden;
      }

      [data-composition-id="intro"] .cta-headline {
        font-weight: 900;
        font-size: 104px;
        line-height: 1.02;
        color: #f5f3ec;
        max-width: 1500px;
        margin-bottom: 34px;
      }

      [data-composition-id="intro"] .cta-headline .gold {
        color: #ffc83d;
      }

      [data-composition-id="intro"] .cta-sub {
        font-weight: 800;
        font-size: 46px;
        letter-spacing: 2px;
        color: #f5f3ec;
        max-width: 1400px;
        margin-bottom: 44px;
      }

      [data-composition-id="intro"] .cta-brand {
        font-weight: 900;
        font-size: 40px;
        letter-spacing: 10px;
        color: #ffc83d;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const q = (sel) => '[data-composition-id="intro"] ' + sel;

        // --- HOOK: 0-2.5s (power4.out / expo.out only) ---
        tl.fromTo(
          q(".hook-line#hook-what"),
          { autoAlpha: 0, y: 40 },
          { autoAlpha: 1, y: 0, duration: 0.4, ease: "expo.out" },
          0.15,
        );

        // Dominant gold 1% — visible well before the 1.2s assertion
        tl.fromTo(
          "#hook-percent",
          { autoAlpha: 0, scale: 0.6 },
          { autoAlpha: 1, scale: 1, duration: 0.45, ease: "power4.out", transformOrigin: "center center" },
          0.55,
        );

        tl.fromTo(
          q(".hook-line#hook-enough"),
          { autoAlpha: 0, y: 40 },
          { autoAlpha: 1, y: 0, duration: 0.4, ease: "expo.out" },
          1.1,
        );

        // Hook exit before 2.5s
        tl.to(
          q(".hook"),
          { autoAlpha: 0, y: -30, duration: 0.35, ease: "power2.in" },
          2.1,
        );

        // --- CTA: settles from 11.5s, held through 15s (no exit = stays in frame) ---
        tl.fromTo(
          "#cta",
          { autoAlpha: 0 },
          { autoAlpha: 1, duration: 0.7, ease: "expo.out" },
          11.6,
        );
        tl.fromTo(
          q(".cta-headline, .cta-sub, .cta-brand"),
          { y: 24 },
          { y: 0, duration: 0.7, ease: "expo.out", stagger: 0.06 },
          11.6,
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["intro"] = tl;
      })();
    </script>
  </div>
</template>

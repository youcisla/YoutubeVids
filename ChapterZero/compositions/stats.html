<template id="stats-template">
  <div
    id="stats-root"
    data-composition-id="stats"
    data-width="1920"
    data-height="1080"
    data-start="0"
    data-duration="15"
  >
    <div class="stats-scene" id="stats-scene">
      <!-- Supporting copy -->
      <div class="headline" id="stats-headline">SMALL GAINS COMPOUND</div>

      <!-- Daily accumulation tiles -->
      <div class="tiles">
        <div class="tile" id="tile-0">1.01</div>
        <div class="tile" id="tile-1">1.02</div>
        <div class="tile" id="tile-2">1.03</div>
        <div class="tile tile-more" id="tile-3">...</div>
      </div>

      <!-- Electric-blue rising path -->
      <div class="path-stage">
        <div class="path-inner" id="path-inner">
          <svg viewBox="0 0 1000 240" width="1000" height="240" preserveAspectRatio="none" aria-hidden="true">
            <polyline
              points="20,210 260,160 500,110 740,60 980,20"
              fill="none"
              stroke="#2e6bff"
              stroke-width="16"
              stroke-linecap="round"
              stroke-linejoin="round"
            ></polyline>
          </svg>
        </div>
      </div>

      <!-- Payoff counter -->
      <div class="counter" id="payoff-37x">1&times;</div>
    </div>

    <style>
      [data-composition-id="stats"] .stats-scene {
        position: absolute;
        inset: 0;
        font-family: "Nunito", sans-serif;
      }

      [data-composition-id="stats"] .headline {
        position: absolute;
        top: 100px;
        left: 0;
        width: 100%;
        text-align: center;
        font-weight: 900;
        font-size: 60px;
        letter-spacing: 6px;
        color: #f5f3ec;
        visibility: hidden;
      }

      [data-composition-id="stats"] .tiles {
        position: absolute;
        top: 250px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 28px;
      }

      [data-composition-id="stats"] .tile {
        width: 150px;
        height: 150px;
        border-radius: 28px;
        background-color: #2e6bff;
        color: #ffffff;
        font-weight: 900;
        font-size: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 16px 0 rgba(46, 107, 255, 0.28);
        visibility: hidden;
      }

      [data-composition-id="stats"] .tile-more {
        color: #ffc83d;
        background-color: #12245a;
        letter-spacing: 4px;
      }

      [data-composition-id="stats"] .path-stage {
        position: absolute;
        top: 440px;
        left: 50%;
        transform: translateX(-50%);
        width: 1000px;
        height: 240px;
      }

      [data-composition-id="stats"] .path-inner {
        width: 1000px;
        height: 240px;
      }

      [data-composition-id="stats"] .path-inner svg {
        display: block;
        width: 1000px;
        height: 240px;
        overflow: visible;
      }

      [data-composition-id="stats"] .counter {
        position: absolute;
        top: 620px;
        left: 0;
        width: 100%;
        text-align: center;
        font-weight: 900;
        font-size: 190px;
        line-height: 1;
        color: #ffc83d;
        visibility: hidden;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });

        // Supporting copy (2.5-11.5 beat opens)
        tl.fromTo(
          '[data-composition-id="stats"] .headline',
          { autoAlpha: 0, y: 30 },
          { autoAlpha: 1, y: 0, duration: 0.45, ease: "expo.out" },
          2.6,
        );

        // Daily accumulation tiles: 1.01, 1.02, 1.03, ... (staggered pop, no bounce)
        ["#tile-0", "#tile-1", "#tile-2", "#tile-3"].forEach(function (sel, i) {
          tl.fromTo(
            sel,
            { autoAlpha: 0, scale: 0.7 },
            { autoAlpha: 1, scale: 1, duration: 0.35, ease: "power4.out", transformOrigin: "center center" },
            2.9 + i * 0.4,
          );
        });

        // Electric-blue rising path draws left -> right (scaleX reveal, allowlist-safe)
        tl.fromTo(
          "#path-inner",
          { scaleX: 0 },
          { scaleX: 1, duration: 3.0, ease: "power2.out", transformOrigin: "left center" },
          3.2,
        );

        // Payoff counter appears, then counts 1x -> 37x (finishes before the 9.5s assertion)
        tl.fromTo(
          "#payoff-37x",
          { autoAlpha: 0, scale: 0.7 },
          { autoAlpha: 1, scale: 1, duration: 0.4, ease: "power4.out", transformOrigin: "center center" },
          6.4,
        );

        const counterEl = document.getElementById("payoff-37x");
        const proxy = { v: 1 };
        tl.to(
          proxy,
          {
            v: 37,
            duration: 2.2,
            ease: "power2.out",
            onUpdate: function () {
              counterEl.innerHTML = Math.round(proxy.v) + "&times;";
            },
          },
          6.8,
        );

        // Whole scene clears before the CTA settles at 11.6
        tl.to(
          "#stats-scene",
          { autoAlpha: 0, duration: 0.3, ease: "power2.in" },
          11.1,
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["stats"] = tl;
      })();
    </script>
  </div>
</template>

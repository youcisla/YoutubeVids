<template id="captions-template">
  <div
    id="captions-root"
    data-composition-id="captions"
    data-width="1920"
    data-height="1080"
    data-start="0"
    data-duration="15"
  >
    <div id="captions-container"></div>

    <style>
      [data-composition-id="captions"] {
        width: 1920px;
        height: 1080px;
        pointer-events: none;
      }

      [data-composition-id="captions"] #captions-container {
        position: absolute;
        bottom: 0px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        justify-content: center;
        align-items: center;
        width: 1600px;
        height: 220px;
      }

      [data-composition-id="captions"] .caption-box {
        position: absolute;
        background-color: #ffc83d;
        color: #0a1633;
        padding: 22px 44px;
        border-radius: 20px;
        font-family: "Nunito", sans-serif;
        font-weight: 900;
        font-size: 60px;
        line-height: 1.08;
        text-align: center;
        max-width: 1500px;
        opacity: 0;
        visibility: hidden;
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.35);
      }
    </style>

    <!-- Approved timing JSON (strict: double-quoted keys, no trailing comma) -->
    <script type="application/json" id="caption-transcript">
[
  { "start": 0.1, "end": 2.794, "text": "What if one percent was enough?" },
  { "start": 2.744, "end": 5.425, "text": "Get one percent better each day." },
  { "start": 5.425, "end": 8.969, "text": "After one year, you're thirty-seven times better." },
  { "start": 8.969, "end": 10.927, "text": "Small habits." },
  { "start": 10.927, "end": 12.86, "text": "Big results." },
  { "start": 12.86, "end": 15, "text": "Watch the full summary." }
]
    </script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const transcriptNode = document.getElementById("caption-transcript");
        const CAPTIONS = transcriptNode
          ? JSON.parse(transcriptNode.textContent)
          : [
              { start: 0.1, end: 2.794, text: "What if one percent was enough?" },
              { start: 2.744, end: 5.425, text: "Get one percent better each day." },
              { start: 5.425, end: 8.969, text: "After one year, you're thirty-seven times better." },
              { start: 8.969, end: 10.927, text: "Small habits." },
              { start: 10.927, end: 12.86, text: "Big results." },
              { start: 12.86, end: 15, text: "Watch the full summary." },
            ];
        const container = document.getElementById("captions-container");
        const tl = gsap.timeline({ paused: true });

        const DURATION = 15;
        const HIDE_DUR = 0.2;

        CAPTIONS.forEach(function (cap, index) {
          const el = document.createElement("div");
          el.className = "caption-box";
          el.textContent = cap.text;
          el.id = "caption-line-" + index;
          container.appendChild(el);

          // Pop in (power4.out) then settle to rest scale — no bounce/elastic
          tl.fromTo(
            el,
            { autoAlpha: 0, scale: 0.85 },
            { autoAlpha: 1, scale: 1.05, duration: 0.2, ease: "power4.out", transformOrigin: "center center" },
            cap.start,
          );
          tl.to(el, { scale: 1, duration: 0.12, ease: "power2.inOut" }, cap.start + 0.2);

          // Hide when the next caption starts (one card visible at a time),
          // clamped so every hide finishes by 15s.
          const next = CAPTIONS[index + 1];
          let hideAt = next ? Math.min(cap.end, next.start) : cap.end;
          hideAt = Math.min(hideAt, DURATION - HIDE_DUR);

          tl.to(
            el,
            { autoAlpha: 0, scale: 0.85, duration: HIDE_DUR, ease: "power2.in" },
            hideAt,
          );
        });

        window.__timelines = window.__timelines || {};
        window.__timelines["captions"] = tl;
      })();
    </script>
  </div>
</template>

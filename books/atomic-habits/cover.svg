<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0D16"/>
      <stop offset="35%" stop-color="#1A0E28"/>
      <stop offset="70%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0A0D16"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#bg)"/>
  <!-- Book spine -->
  <rect x="0" y="0" width="40" height="900" fill="#1E293B" rx="2"/>
  <!-- Top bar -->
  <rect x="40" y="30" width="520" height="2" fill="rgba(250,204,21,0.3)"/>
  <!-- Title -->
  <text x="320" y="220" text-anchor="middle" font-family="Georgia,serif" font-size="52" font-weight="bold" fill="#F8FAFC" letter-spacing="2">ATOMIC</text>
  <text x="320" y="280" text-anchor="middle" font-family="Georgia,serif" font-size="52" font-weight="bold" fill="#FACC15" letter-spacing="2">HABITS</text>
  <!-- Subtitle -->
  <text x="320" y="340" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#94A3B8" letter-spacing="3">AN EASY &amp; PROVEN WAY TO</text>
  <text x="320" y="370" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#94A3B8" letter-spacing="3">BUILD GOOD HABITS</text>
  <text x="320" y="400" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#94A3B8" letter-spacing="3">&amp; BREAK BAD ONES</text>
  <!-- Separator -->
  <line x1="200" y1="430" x2="440" y2="430" stroke="rgba(250,204,21,0.3)" stroke-width="1"/>
  <!-- Author -->
  <text x="320" y="480" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#CBD5E1" letter-spacing="1">JAMES CLEAR</text>
  <!-- Decorative larger title -->
  <text x="320" y="700" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="rgba(250,204,21,0.15)" letter-spacing="6">TRANSFORM YOUR LIFE</text>
  <text x="320" y="730" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="rgba(250,204,21,0.10)" letter-spacing="6">ONE PERCENT AT A TIME</text>
</svg>

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,height=1080">
<title>{BOOK} — Scene {N}</title>
<script src="{GSAP_SRC}"></script>
<style>
@font-face{font-family:'Space Grotesk';src:local('Space Grotesk'),local('Space Grotesk-Bold');}
@font-face{font-family:'Inter';src:local('Inter'),local('Inter-Regular');}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;overflow:hidden;font-family:'Inter',sans-serif;color:#F8FAFC;background:#0A0D16;}
audio{display:none;}
#bg-stage{position:absolute;inset:0;z-index:0;overflow:hidden;background:#0A0D16;}
.bg-orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.55;mix-blend-mode:screen;}
#orb-1{width:900px;height:900px;background:radial-gradient(circle,#FACC15 0%,transparent 70%);top:-20%;left:-15%;}
#orb-2{width:1100px;height:1100px;background:radial-gradient(circle,#A78BFA 0%,transparent 70%);bottom:-25%;right:-20%;}
#orb-3{width:700px;height:700px;background:radial-gradient(circle,#34D399 0%,transparent 70%);top:30%;left:40%;}
#bg-vignette{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 30%,rgba(10,13,22,0.85) 100%);}
#stage{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:120px 140px;}
.cb{display:inline-block;align-self:flex-start;padding:10px 28px;border:1px solid rgba(250,204,21,0.4);font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:500;letter-spacing:4px;text-transform:uppercase;color:rgba(250,204,21,0.9);margin-bottom:36px;}
.h1{font-family:'Space Grotesk',sans-serif;font-size:120px;font-weight:600;letter-spacing:-0.025em;line-height:1.05;max-width:1600px;margin-bottom:24px;}
.h2{font-family:'Space Grotesk',sans-serif;font-size:84px;font-weight:600;letter-spacing:-0.02em;line-height:1.1;max-width:1600px;margin-bottom:24px;}
.kw{color:#FACC15;font-weight:700;}
.divider{width:80px;height:3px;background:linear-gradient(90deg,#FACC15 0%,transparent 100%);margin:32px 0;}
.icon-wrap{position:absolute;right:180px;top:50%;transform:translateY(-50%);width:480px;height:480px;opacity:0.85;}
.icon-svg{width:100%;height:100%;}
.num-big{position:absolute;right:180px;top:50%;transform:translateY(-50%);font-family:'Space Grotesk',sans-serif;font-size:480px;font-weight:700;color:rgba(250,204,21,0.12);line-height:1;letter-spacing:-0.05em;}
#cap-bar{position:absolute;left:0;right:0;bottom:80px;z-index:20;display:flex;justify-content:center;padding:0 140px;pointer-events:none;}
#cap-line{font-family:'Inter',sans-serif;font-size:46px;font-weight:500;line-height:1.3;color:#F8FAFC;text-align:center;text-shadow:0 2px 16px rgba(0,0,0,0.9),0 0 32px rgba(10,13,22,0.95);max-width:1640px;letter-spacing:-0.005em;}
.word{display:inline-block;margin-right:0.32em;opacity:0.25;}
.word.live{opacity:1;color:#FACC15;text-shadow:0 0 20px rgba(250,204,21,0.4);}
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-start="0" data-duration="{DUR}" data-width="1920" data-height="1080">
<audio id="narration" src="narration.wav" data-start="0" data-duration="{DUR}"></audio>
<div id="bg-stage">
  <div id="orb-1" class="bg-orb"></div>
  <div id="orb-2" class="bg-orb"></div>
  <div id="orb-3" class="bg-orb"></div>
  <div id="bg-vignette"></div>
</div>
<div id="stage">
  <div class="cb">{BOOK}</div>
  {CONTENT}
</div>
<div id="cap-bar"><div id="cap-line"></div></div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const R = '[data-composition-id="main"]';
const DUR = {DUR};
tl.to({}, { duration: DUR }, 0);
{ANIMATIONS}
window.__timelines["main"] = tl;
</script>
</body>
</html>

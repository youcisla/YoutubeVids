<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,height=1080">
<title>{BOOK} — Scene {N}</title>
<script src="{GSAP_SRC}"></script>
<style>
@font-face{font-family:'Space Grotesk';src:local('Space Grotesk'),local('Space Grotesk-Bold');}
@font-face{font-family:'Inter';src:local('Inter'),local('Inter-Regular');}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;overflow:hidden;font-family:'Inter',sans-serif;color:#F8FAFC;background:#0A0D16;}
#bg-wrap{position:absolute;inset:0;z-index:0;overflow:hidden;}
#bg-cover{position:absolute;inset:-5%;background:linear-gradient(135deg,rgba(10,13,22,0.93) 0%,rgba(10,13,22,0.72) 50%,rgba(10,13,22,0.93) 100%),url('cover.{EXT}') center/cover no-repeat;filter:blur(12px) saturate(0.5) brightness(0.20);transform:scale(1.1);animation:kb 240s ease-in-out infinite alternate;}
#bg-ambient{position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse 80% 60% at 50% 40%,rgba(250,204,21,0.045) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 70% 80%,rgba(167,139,250,0.03) 0%,transparent 50%);opacity:0.7;}
@keyframes kb{from{transform:scale(1.1) brightness(0.20);}to{transform:scale(1.16) brightness(0.22);}}
.scene{position:absolute;inset:0;z-index:10;display:flex;padding:100px 140px 120px;}
.scene-inner{flex:1;display:flex;flex-direction:column;max-width:1640px;}
.cb{display:inline-block;align-self:flex-start;padding:8px 24px;border:1px solid rgba(250,204,21,0.3);font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:rgba(250,204,21,0.8);margin-bottom:28px;}
.h1{font-family:'Space Grotesk',sans-serif;font-size:90px;font-weight:600;letter-spacing:-0.02em;line-height:1.1;}
.h2{font-family:'Space Grotesk',sans-serif;font-size:56px;font-weight:600;letter-spacing:-0.02em;line-height:1.15;}
.bt{font-size:32px;font-weight:300;line-height:1.35;color:#CBD5E1;}
.bt .hl{color:#FACC15;font-weight:500;}
.sd{width:60px;height:2px;background:rgba(250,204,21,0.5);margin:20px 0;}
.sd.cen{margin:20px auto;}
.card{background:rgba(15,23,42,0.55);border:1px solid rgba(148,163,184,0.1);border-radius:4px;padding:24px 28px;}
.card .cn{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:#FACC15;margin-bottom:8px;}
.card .ct{font-size:28px;font-weight:300;line-height:1.3;color:#E2E8F0;}
.g1{display:grid;grid-template-columns:1fr;gap:40px;flex:1;align-content:center;max-width:1400px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:40px;flex:1;align-content:center;max-width:1520px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
.cen{text-align:center;}
.cen>*{margin-left:auto;margin-right:auto;}
audio{display:none;}
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-start="0" data-duration="{DUR}" data-width="1920" data-height="1080">
<audio id="narration" src="narration.wav" data-start="0" data-duration="{DUR}"></audio>
<div id="bg-wrap"><div id="bg-cover"></div><div id="bg-ambient"></div></div>
{CONTENT}
</div>
<script>
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});
const R='[data-composition-id="main"]';
const DUR={DUR};
tl.to({},{duration:DUR},0);
{ANIMATIONS}
window.__timelines["main"]=tl;
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,height=1080">
<title>Atomic Habits — Scene 2</title>
<script src="gsap.min.js"></script>
<style>
@font-face{font-family:'Space Grotesk';src:local('Space Grotesk'),local('Space Grotesk-Bold');}
@font-face{font-family:'Inter';src:local('Inter'),local('Inter-Regular');}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:1920px;height:1080px;overflow:hidden;
  font-family:'Inter',sans-serif;color:#F8FAFC;
  background:#0A0D16;
}
#bg-wrap{position:absolute;inset:0;z-index:0;overflow:hidden;}
#bg-cover{
  position:absolute;inset:-5%;
  background:linear-gradient(135deg,rgba(10,13,22,0.93) 0%,rgba(10,13,22,0.72) 50%,rgba(10,13,22,0.93) 100%),url('cover.svg') center/cover no-repeat;
  filter:blur(12px) saturate(0.5) brightness(0.20);
  transform:scale(1.1);
  animation:kb 240s ease-in-out infinite alternate;
}
#bg-ambient{
  position:absolute;inset:0;z-index:1;
  background:radial-gradient(ellipse 80% 60% at 50% 40%, rgba(250,204,21,0.045) 0%, transparent 60%),
              radial-gradient(ellipse 60% 50% at 70% 80%, rgba(167,139,250,0.03) 0%, transparent 50%);
  opacity:0.7;
}
@keyframes kb{from{transform:scale(1.1) brightness(0.20);}to{transform:scale(1.16) brightness(0.22);}}

.scene{
  position:absolute;inset:0;z-index:10;
  display:flex;padding:100px 140px 120px;
}
.scene-inner{flex:1;display:flex;flex-direction:column;max-width:1640px;}
.cb{
  display:inline-block;align-self:flex-start;
  padding:8px 24px;border:1px solid rgba(250,204,21,0.3);
  font-family:'Space Grotesk',sans-serif;
  font-size:18px;font-weight:500;letter-spacing:3px;text-transform:uppercase;
  color:rgba(250,204,21,0.8);margin-bottom:28px;
}
.h1{font-family:'Space Grotesk',sans-serif;font-size:90px;font-weight:600;letter-spacing:-0.02em;line-height:1.1;}
.h2{font-family:'Space Grotesk',sans-serif;font-size:56px;font-weight:600;letter-spacing:-0.02em;line-height:1.15;}
.bt{font-size:32px;font-weight:300;line-height:1.35;color:#CBD5E1;}
.bt .hl{color:#FACC15;font-weight:500;}
.sd{width:60px;height:2px;background:rgba(250,204,21,0.5);margin:20px 0;}
.sd.cen{margin:20px auto;}
.card{
  background:rgba(15,23,42,0.55);
  border:1px solid rgba(148,163,184,0.1);
  border-radius:4px;padding:24px 28px;
}
.card .cn{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:#FACC15;margin-bottom:8px;}
.card .ct{font-size:28px;font-weight:300;line-height:1.3;color:#E2E8F0;}
.g1{display:grid;grid-template-columns:1fr;gap:40px;flex:1;align-content:center;max-width:1400px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:40px;flex:1;align-content:center;max-width:1520px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
.cen{text-align:center;}
.cen>*{margin-left:auto;margin-right:auto;}

/* Caption bar — static phrase, no animation */
#cbar{
  position:absolute;left:50%;bottom:120px;z-index:50;
  transform:translateX(-50%);
  background:rgba(10,13,22,0.90);
  border:1px solid rgba(250,204,21,0.15);
  border-radius:10px;
  padding:16px 30px;
  backdrop-filter:blur(12px);
  max-width:1400px;
  text-align:center;
  opacity:0;visibility:hidden;
}
#cbar .text{
  font-size:34px;font-weight:400;
  color:#E2E8F0;letter-spacing:0.02em;
}
#cbar .hl{color:#FACC15;font-weight:500;}

audio{display:none;}
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-start="0" data-duration="38" data-width="1920" data-height="1080">
<audio id="narration" src="narration.wav" data-start="0" data-duration="38"></audio>

<div id="bg-wrap"><div id="bg-cover"></div><div id="bg-ambient"></div></div>

<div id="cbar"><span class="text">Habits are the <span class="hl">compound interest</span> of self-improvement</span></div>

<div class="scene" id="s2"><div class="scene-inner g1 cen" style="max-width:1300px;"><div class="cb">The Mathematics</div><h2 class="h2" style="font-size:64px;">Habits <span style="color:#FACC15;">compound</span></h2><div class="sd cen"></div><div style="display:flex;gap:30px;justify-content:center;margin-top:10px;"><div class="card" style="text-align:center;min-width:240px;"><div class="cn" style="color:#34D399;font-size:42px;">+37x</div><div class="ct" style="font-size:26px;">Daily 1% gain</div></div><div class="card" style="text-align:center;min-width:240px;"><div class="cn" style="color:#EF4444;font-size:42px;">~0</div><div class="ct" style="font-size:26px;">Daily 1% decline</div></div></div></div></div>

</div>

<script>
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});
const R='[data-composition-id="main"]';
const DUR=38;

// Caption bar fades in at 0.3s, out at DUR-0.3
tl.set('#cbar',{opacity:0,visibility:'hidden'},0);
tl.to('#cbar',{opacity:1,visibility:'visible',duration:0.4,ease:'power2.out'},0.3);
tl.to('#cbar',{opacity:0,visibility:'hidden',duration:0.3,ease:'power2.in'},DUR-0.3);

tl.from(R+' .cb',{opacity:0,y:-15,duration:0.6,ease:'power4.out'},0.3);tl.from(R+' h2',{opacity:0,y:30,duration:1,ease:'power4.out'},0.5);tl.from(R+' .sd',{scaleX:0,transformOrigin:'center',duration:0.6,ease:'power4.out'},1.2);tl.from(R+' .card',{opacity:0,y:20,duration:0.7,ease:'power4.out',stagger:0.15},1.8);

window.__timelines["main"]=tl;
</script>
</body>
</html>
